name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DbcView.sln

      - name: Build
        run: dotnet build DbcView.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test DbcView.sln --no-build --no-restore --configuration Release --verbosity normal

      - name: Verify formatting
        run: dotnet format DbcView.sln --verify-no-changes --no-restore --verbosity minimal

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      - name: Publish AOT
        run: dotnet publish src/DbcView.Web -c Release -p:RunAOTCompilation=true -o publish

      # Project site (https://HestiaLab.github.io/DbcView/) needs the base
      # href rewritten.
      - name: Set base href for project site
        run: sed -i 's|<base href="/"|<base href="/DbcView/"|' publish/wwwroot/index.html

      - name: Assert published shell
        shell: bash
        run: |
          set -euo pipefail
          index="publish/wwwroot/index.html"
          if ! grep -qF '<base href="/DbcView/"' "$index"; then
            echo "::error::base href rewrite failed; expected /DbcView/ in $index"
            exit 1
          fi
          if ! grep -qF '_framework/blazor.webassembly.js' "$index"; then
            echo "::error::published index.html does not reference the Blazor WebAssembly boot script"
            exit 1
          fi
          if [ ! -f "publish/wwwroot/_content/Atlas.Blazor/atlas-v2/atlas.css" ]; then
            echo "::error::Atlas static asset is missing from the published output"
            exit 1
          fi
          if [ ! -f "publish/wwwroot/_content/Astrea.Components/astrea-tree.css" ]; then
            echo "::error::Astrea tree asset is missing from the published output"
            exit 1
          fi
          native=$(find publish/wwwroot/_framework -maxdepth 1 -name 'dotnet.native.*.wasm' -print -quit)
          if [ -z "$native" ]; then
            echo "::error::AOT native runtime is missing from the published output"
            exit 1
          fi
          size=$(stat -c%s "$native")
          if [ "$size" -lt 10000000 ]; then
            echo "::error::AOT publish not detected (native runtime is only $size bytes)"
            exit 1
          fi

      - name: Add SPA 404 fallback
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
