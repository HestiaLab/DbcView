name: CI

on:
  push:
    branches: [main, master, 'feature/**', 'feat/**', 'fix/**', 'refactor/**', 'infra/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DbcView.sln

      - name: Build
        run: dotnet build DbcView.sln --no-restore --configuration Release

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test DbcView.sln --no-build --no-restore --configuration Release --verbosity normal

      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet test DbcView.sln --no-build --no-restore --configuration Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ubuntu
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore DbcView.sln
      - run: dotnet format DbcView.sln --verify-no-changes --no-restore --verbosity minimal
