name: Add to project board

on:
  issues:
    types:
      - opened
      - reopened
      - transferred
  pull_request:
    types:
      - opened
      - reopened

permissions:
  contents: read

jobs:
  add-to-project:
    name: Add issue or PR to HestiaLab board
    # Fork PRs do not receive repository secrets, so the PAT-backed board
    # automation is skipped for them and maintainers add those manually.
    if: >
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/orgs/HestiaLab/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
